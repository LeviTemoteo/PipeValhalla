[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipevalhalla"
version = "0.1.0"
description = "Sistema via CLI para gerenciar banco de dados do Brawlhalla"
readme = "README.md"
requires-python = ">=3.9"

dependencies = ["supabase>=2.0.0", "python-dotenv>=1.0.0",]

[project.scripts]
pipevalhalla = "pipevalhalla.main:main"

[tool.setuptools.packages.find]
where = ["src"]